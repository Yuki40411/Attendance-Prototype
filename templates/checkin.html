{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-center mt-5">
    <div class="card shadow border-0" style="width: 100%; max-width: 450px;">
        <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0">Student Check-in</h3>
        </div>
        <div class="card-body p-4 text-center">
            
            <h4 class="mb-4">Hello, <span class="text-primary">{{ session.get('student_name') }}</span>!</h4>
            <p class="text-muted mb-4">Look at the whiteboard and enter the 4-digit PIN to mark yourself present.</p>

            <form method="post" action="/checkin">
                <div class="mb-4">
                    <input type="text" name="pin" class="form-control form-control-lg text-center tracking-widest fs-2 py-3" placeholder="----" maxlength="4" required autofocus autocomplete="off">
                </div>
                
                <button type="submit" class="btn btn-success btn-lg w-100">Check In Now</button>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
