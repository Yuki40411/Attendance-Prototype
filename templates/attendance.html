{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-white pt-4 pb-3">
        <h3>Mark Class Attendance</h3>
    </div>
    <div class="card-body">
        <a href="/"><-- Back to Home</a><br><br>
        <form method="post">
            <div class="mb-4 row">
                <label for="date" class="col-sm-2 col-form-label fw-bold">Class Date:</label>
                <div class="col-sm-4">
                    <input type="date" name="date" class="form-control" required>
                </div>
            </div>
            
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ student['student_id'] }}</td>
                        <td class="fw-bold">{{ student['name'] }}</td>
                        <td>
                            <select name="{{ student['student_id'] }}" class="form-select w-50">
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                                <option value="Late">Late</option>
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-success btn-lg px-5">Submit Attendance</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
