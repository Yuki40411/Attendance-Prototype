{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mt-4">
    <div class="card-header bg-white pt-4 pb-3">
        <h3 class="mb-0 text-primary">Upload Student CSV</h3>
    </div>
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <div class="mb-4">
                <label for="class_name" class="form-label fw-bold">Subject / Class Name:</label>
                <input type="text" name="class_name" class="form-control w-50" placeholder="e.g. Math 101" required>
            </div>
            <div class="mb-4">
                <label for="file" class="form-label fw-bold">Select CSV File:</label>
                <input type="file" name="file" class="form-control w-50" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary px-4">Upload and Enroll Students</button>
        </form>
    </div>
</div>
{% endblock %}
