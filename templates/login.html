<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    
    <div class="card shadow border-0" style="width: 100%; max-width: 450px;">
        <div class="card-header bg-dark text-white text-center py-4">
            <h3 class="mb-0">System Login</h3>
        </div>
        <div class="card-body p-4">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'message' else 'info' }} mb-4">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" action="/login">
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted">I am a...</label>
                    <select name="role" class="form-select form-select-lg" id="roleSelect" onchange="toggleFields()" required>
                        <option value="" disabled selected>-- Select Role --</option>
                        <option value="student">Student</option>
                        <option value="lecturer">Lecturer / Admin</option>
                    </select>
                </div>
                
                <div class="mb-4" id="studentField" style="display: none;">
                    <label class="form-label fw-bold text-muted">Student ID</label>
                    <input type="text" name="student_id" class="form-control form-control-lg" placeholder="Enter your ID">
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn" disabled>Login</button>
            </form>
        </div>
    </div>

    <script>
        function toggleFields() {
            var role = document.getElementById("roleSelect").value;
            var studentField = document.getElementById("studentField");
            var loginBtn = document.getElementById("loginBtn");
            
            loginBtn.disabled = false;
            
            if (role === "student") {
                studentField.style.display = "block"; // Show ID input for students
            } else if (role === "lecturer") {
                studentField.style.display = "none"; // Hide everything for lecturers
            }
        }
    </script>
</body>
</html>
